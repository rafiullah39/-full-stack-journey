<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Mobile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .top-header {
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            color: #1877f2;
            font-weight: 800;
            font-size: 24px;
            margin: 0;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f0f2f5;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #050505;
        }
        .messenger-btn {
            position: relative;
        }
        .badge-msg {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #fa3e3e;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            border-radius: 10px;
            padding: 1px 4px;
            border: 2px solid #fff;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .post-input-box {
            flex: 1;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 10px 16px;
            color: #65676b;
        }
        .stories-track {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 8px 12px 8px;
            scrollbar-width: none;
        }
        .stories-track::-webkit-scrollbar { display: none; }
        .story-card {
            position: relative;
            flex: 0 0 100px;
            height: 170px;
            border-radius: 12px;
            overflow: hidden;
            background: #ccc;
        }
        .story-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%);
        }
        .story-avatar-ring {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid #1877f2;
            overflow: hidden;
            z-index: 2;
        }
        .story-avatar-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-name {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
        }
        .create-story-card {
            background: #fff;
        }
        .create-story-img-wrap {
            height: 70%;
            overflow: hidden;
        }
        .create-story-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .create-story-btn {
            position: absolute;
            left: 50%;
            top: 70%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1877f2;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .create-story-card .story-name {
            color: #050505;
            bottom: 6px;
            text-align: center;
        }
        .create-story-card::after {
            content: none;
        }
        .follow-btn {
            background: none;
            border: none;
            color: #1877f2;
            font-weight: 600;
            font-size: 13px;
            padding: 0;
        }
        .globe-icon {
            color: #65676b;
        }
        .post-media img {
            width: 100%;
            display: block;
        }
        .action-btn {
            background: none;
            border: none;
            color: #65676b;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn svg {
            fill: #65676b;
        }
        .bottom-nav {
            background: #fff;
            border-top: 1px solid #dadde1;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .nav-item {
            color: #65676b;
            flex: 1;
            text-align: center;
            padding: 10px 0;
            position: relative;
        }
        .nav-item.active {
            color: #1877f2;
            border-bottom: 2px solid #1877f2;
        }
        .nav-item.active svg {
            fill: #1877f2;
        }
        .nav-profile-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header class="top-header d-flex align-items-center justify-content-between px-3 py-2">
            <div class="d-flex align-items-center gap-2">
                <button class="icon-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
                <h1 class="logo">facebook</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="icon-btn" aria-label="Create">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 11H13V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/></svg>
                </button>
                <button class="icon-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10 2a8 8 0 1 0 5.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
                </button>
                <button class="icon-btn messenger-btn" aria-label="Messenger">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.477 2 2 6.145 2 11.243c0 2.91 1.445 5.493 3.69 7.18V22l3.411-1.873c.91.254 1.879.39 2.899.39 5.523 0 10-4.145 10-9.243S17.523 2 12 2zm1.191 12.37l-2.55-2.722-4.978 2.722 5.474-5.811 2.55 2.722 4.978-2.722-5.474 5.811z"/></svg>
                    <span class="badge-msg">9+</span>
                </button>
            </div>
        </header>
        <main class="feed-content">
            <section class="bg-white px-3 py-3 mb-2">
                <div class="d-flex align-items-center gap-2">
                    <img src="rafi.jpeg" alt="Profile" class="avatar">
                    <div class="post-input-box">What's on your mind?</div>
                    <div>
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="#45BD62" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </div>
                </div>
            </section>
            <section class="bg-white mb-2">
                <div class="stories-track">
                    <div class="story-card create-story-card">
                        <div class="create-story-img-wrap">
                            <img src="rafi.jpeg" alt="Create Story">
                        </div>
                        <div class="create-story-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#fff" d="M19 11H13V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/></svg>
                        </div>
                        <span class="story-name">Create story</span>
                    </div>
                    <div class="story-card">
                        <img src="arynews.jpeg" alt="Story 1" class="story-bg">
                        <div class="story-avatar-ring">
                            <img src="ary_profile.jpeg" alt="User">
                        </div>
                        <span class="story-name">ARY News</span>
                    </div>
                    <div class="story-card">
                        <img src="shaheen.jpeg" alt="Story 2" class="story-bg">
                        <div class="story-avatar-ring">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=80&q=80" alt="User">
                        </div>
                        <span class="story-name">Swat 11 Cricket</span>
                    </div>
                    <div class="story-card">
                        <img src="kalam_valley.jpeg" alt="Story 3" class="story-bg">
                        <div class="story-avatar-ring">
                            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=80&q=80" alt="User">
                        </div>
                        <span class="story-name">Kalam Valley</span>
                    </div>
                    <div class="story-card">
                        <img src="malamjaba.jpeg" alt="Story 4" class="story-bg">
                        <div class="story-avatar-ring">
                            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=80&q=80" alt="User">
                        </div>
                        <span class="story-name">Malam Jabba</span>
                    </div>
                </div>
            </section>
            <article class="bg-white">
                <div class="d-flex align-items-center justify-content-between px-3 pt-3">
                    <div class="d-flex align-items-center gap-2">
                        <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?auto=format&fit=crop&w=100&q=80" alt="Discover Swat" class="avatar">
                        <div>
                            <div class="d-flex align-items-center gap-1">
                                <span class="fw-semibold" style="font-size:15px;">Discover Swat</span>
                                <span class="text-secondary">•</span>
                                <button class="follow-btn">Follow</button>
                            </div>
                            <div class="d-flex align-items-center gap-1 text-secondary" style="font-size:13px;">
                                <span>3d</span>
                                <span>•</span>
                                <svg class="globe-icon" viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm5.93 5h-2.53a12.8 12.8 0 0 0-1.1-3.32A6.51 6.51 0 0 1 13.93 5zM8 1.5c.83 1.15 1.48 2.5 1.83 4H6.17c.35-1.5 1-2.85 1.83-4zM1.5 8c0-.55.07-1.08.2-1.6h2.83c-.03.52-.03 1.05 0 1.6H1.7c-.13-.52-.2-1.05-.2-1.6zm.57 3.5h2.53c.33 1.25.79 2.44 1.35 3.52A6.52 6.52 0 0 1 2.07 11.5zm3.03-7h5.8c-.33-1.25-.79-2.44-1.35-3.52A6.52 6.52 0 0 0 5.1 4.5zm5.8 8c-.35 1.5-1 2.85-1.83 4-.83-1.15-1.48-2.5-1.83-4h3.66zm.87 1.92c.57-1.08 1.02-2.27 1.35-3.52h2.53a6.52 6.52 0 0 1-3.88 3.52zM11.67 9.5H4.33c-.03-.52-.03-1.05 0-1.6h7.34c.03.52.03 1.05 0 1.6z"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <button class="icon-btn" aria-label="More Options">
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </button>
                        <button class="icon-btn" aria-label="Close">
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7a.996.996 0 1 0-1.41 1.41L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.89a.996.996 0 1 0 1.41-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="px-3 py-2">
                    <p class="mb-0" dir="rtl" lang="ur">کالام — فطرت کے حسین رنگوں کا شہر 😍 سبحان اللہ</p>
                </div>
                <div class="post-media">
                    <img src="kalam.webp" alt="Kalam Valley Scenery">
                </div>
                <div class="d-flex align-items-center justify-content-between px-3 py-2 small text-secondary border-bottom">
                    <div class="d-flex align-items-center gap-1">
                        <span>👍❤️</span>
                        <span>1.2K</span>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <span>84 comments</span>
                        <span>•</span>
                        <span>12 shares</span>
                    </div>
                </div>
                <div class="d-flex justify-content-around py-1 pb-2">
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19.5 9.5h-4.33l.86-3.95.02-.23c0-.42-.17-.8-.44-1.08L14.16 3.5l-5.33 5.33C8.42 9.09 8 9.77 8 10.5v8c0 1.1.9 2 2 2h7c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2zM6 10.5H2v10h4v-10z"/></svg>
                        <span>Like</span>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.15.93 4.11 2.47 5.56-.2 1.43-.87 3.32-2.14 4.74 2.16-.1 4.21-.84 5.76-2.06C9.37 19.64 10.66 20 12 20c5.52 0 10-3.58 10-8s-4.48-8-10-8zm0 14c-1.17 0-2.31-.32-3.31-.93l-.24-.15-1.92.67.68-1.85-.16-.25C6.18 13.88 5.5 12.5 5.5 11c0-3.31 2.91-6 6.5-6s6.5 2.69 6.5 6-2.91 6-6.5 6z"/></svg>
                        <span>Comment</span>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.15c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                        <span>Share</span>
                    </button>
                </div>
            </article>
        </main>
        <nav class="bottom-nav d-flex">
            <a href="#" class="nav-item active" aria-label="Home">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3l10 9h-3v9H5v-9H2l10-9z"/></svg>
            </a>
            <a href="#" class="nav-item" aria-label="Video / Watch">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </a>
            <a href="#" class="nav-item" aria-label="Friends">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </a>
            <a href="#" class="nav-item" aria-label="Marketplace">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 6h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-3-3c-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2a3 3 0 0 0-3 3c0 .35.07.69.18 1H4c-1.1 0-1.99.9-1.99 2L2 19c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.33 8.67 12 12 8.67 15.33 12 17 10.33 14.92 8H20v6z"/></svg>
            </a>
            <a href="#" class="nav-item notif-tab" aria-label="Notifications">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span class="badge-msg">9+</span>
            </a>
            <a href="#" class="nav-item" aria-label="Menu / Profile">
                <img src="rafi.jpeg" alt="Profile avatar" class="nav-profile-img">
            </a>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
