<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="lib/bootstrap.min.css" rel="stylesheet">
  <link href="lib/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Messages | ConnecFriend</title>
</head>
<body>
  <div id="navbar"></div>

  <main class="container-xl py-4">
    <div class="row g-4">

      <!-- left: conversations -->
      <div class="col-lg-4">
        <div class="card-soft p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Messages</h4>
            <span class="chip" id="tabChip">Friends</span>
          </div>
          <div class="toggle-box mb-3">
            <button type="button" id="tab_friends" class="active" onclick="changeTab('friends')"><i class="bi bi-heart"></i> Friends (<span id="friendTotal">0</span>)</button>
            <button type="button" id="tab_others" onclick="changeTab('others')"><i class="bi bi-people"></i> Other Members (<span id="otherTotal">0</span>)</button>
          </div>
          <input type="text" id="searchBox" class="form-control input-soft form-control-sm mb-2" placeholder="Filter conversations...">
          <div id="memberList" class="scroll-list"></div>
          <div class="small text-secondary mt-3 p-2 card-tint"><i class="bi bi-info-circle"></i> Replies are real. To see one, open another browser tab and log in as that person.</div>
        </div>
      </div>

      <!-- right: chat window -->
      <div class="col-lg-8">
        <div class="card-soft overflow-hidden">
          <div id="chatHeader" class="p-3 border-bottom"></div>
          <div id="chatBox" class="chat-box p-3"></div>
          <form id="msgForm" class="p-3 border-top d-flex gap-2" novalidate>
            <input type="text" id="msgInput" class="form-control input-soft rounded-pill" maxlength="300" placeholder="Type a private message...">
            <button class="btn btn-grad rounded-pill px-4 fw-semibold" type="submit">Send <i class="bi bi-send"></i></button>
          </form>
          <div id="msgError" class="text-danger small px-3 pb-2 d-none"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
